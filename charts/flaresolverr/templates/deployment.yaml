{{/*
FlareSolverr: headless-Chromium proxy that solves Cloudflare's anti-bot
challenges on behalf of Prowlarr indexers (eztv, 1337x, torrentgalaxy, ...).
It is NOT a linuxserver.io image - no PUID/PGID and no /config or /data PVC -
so it does not use the shared common deployment template. Chromium needs a
sizeable /dev/shm, provided by a Memory-backed emptyDir.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "mediaserver.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mediaserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediaserver.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: LOG_LEVEL, value: {{ .Values.logLevel | quote }} }
            - { name: TZ,        value: {{ .Values.tz | quote }} }
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: {{ .Values.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: {{ .Values.port }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
