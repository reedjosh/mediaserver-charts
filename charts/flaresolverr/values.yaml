image:
  repository: ghcr.io/flaresolverr/flaresolverr
  tag: latest
  pullPolicy: Always

# FlareSolverr's HTTP API port (Prowlarr talks to it here as an indexer proxy).
port: 8191
tz: America/Denver
logLevel: info

# Not a linuxserver.io image: no PUID/PGID, no /config or /data PVC. It runs a
# headless Chromium, so it gets a Memory-backed /dev/shm instead (see deployment).
service:
  type: ClusterIP
  port: 8191

probe:
  path: /health

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

nodeSelector: {}
