apiVersion: v1
kind: ConfigMap
metadata:
  name: reencoder-script
data:
  reencode.sh: |
    #!/bin/sh
    # Library re-encoder. Finds oversized legacy video and transcodes it to a
    # more efficient codec, parking originals in a trash dir (never hard-deletes).
    set -u
    ROOT="$MEDIA_PATH"
    TRASH="$TRASH_DIR"
    mkdir -p "$TRASH"
    # Tombstones: files we already re-encoded that came out no smaller. Kept OUTSIDE
    # the trash dir so the retention purge never deletes it (re-encoding is expensive).
    SKIPLIST="$(dirname "$TRASH")/.reencode-skiplist"

    # Purge re-encode trash older than the retention window (mtime is stamped
    # when a file is moved into trash, so this is "days since trashed").
    KEEP="${TRASH_KEEP_DAYS:-7}"
    echo "purging trash older than ${KEEP}d from $TRASH"
    find "$TRASH" -type f -mtime +"$KEEP" -delete 2>/dev/null
    find "$TRASH" -type d -empty -delete 2>/dev/null

    # Pick the encoder: hardware (NVENC/VAAPI) if GPU enabled, else software.
    if [ "${GPU_ENABLED:-0}" = "1" ]; then
      if [ "$GPU_VENDOR" = "intel" ]; then
        [ "$CODEC" = "av1" ] && ENC="av1_vaapi" || ENC="hevc_vaapi"
        HWOPTS="-vaapi_device /dev/dri/renderD128 -vf format=nv12,hwupload"
      else
        [ "$CODEC" = "av1" ] && ENC="av1_nvenc" || ENC="hevc_nvenc"
        # NVDEC decode; ffmpeg falls back to software for codecs NVDEC can't handle.
        # Decoded frames land in system RAM (no -hwaccel_output_format cuda) so the
        # -pix_fmt software filter below keeps working.
        HWOPTS="-hwaccel cuda"
      fi
      QOPT="-cq $CRF"
    else
      [ "$CODEC" = "av1" ] && ENC="libsvtav1" || ENC="libx265"
      HWOPTS=""
      QOPT="-crf $CRF -preset $PRESET"
    fi
    echo "reencoder: codec=$CODEC encoder=$ENC crf=$CRF maxFiles=$MAX_FILES (>${MIN_SIZE_MB}MB, skipHDR=$SKIP_HDR skip4K=$SKIP_4K, maxrate=${REENCODE_MAXRATE_PCT:-100}%-of-source keepIfUnder=${KEEP_MAX_PCT:-90}%)"

    count=0
    find "$ROOT" -type f \( -name '*.mkv' -o -name '*.mp4' -o -name '*.avi' -o -name '*.m4v' \) | sort | while IFS= read -r f; do
      [ "$count" -ge "$MAX_FILES" ] && { echo "reached maxFiles=$MAX_FILES"; break; }

      sz=$(stat -c %s "$f" 2>/dev/null || echo 0)
      [ "$sz" -lt $(( MIN_SIZE_MB * 1024 * 1024 )) ] && continue

      rel="${f#$ROOT/}"
      # Tombstone: a prior run already re-encoded this and it came out no smaller, so
      # skip it forever instead of burning hours re-encoding it to (again) no gain.
      if [ -f "$SKIPLIST" ] && grep -Fxq "$rel" "$SKIPLIST"; then continue; fi

      # head -1 + strip whitespace: guard against multi-stream output / stray CR-LF
      # that previously broke the skip checks (re-encoded an HEVC HDR file by mistake)
      vc=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" 2>/dev/null | head -1 | tr -d '[:space:]')
      case "$vc" in hevc|av1|"") continue ;; esac        # already efficient (or unreadable)

      h=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f" 2>/dev/null | head -1 | tr -d '[:space:]')
      [ "$SKIP_4K" = "1" ] && [ "${h:-0}" -gt 1100 ] && continue

      ct=$(ffprobe -v error -select_streams v:0 -show_entries stream=color_transfer -of csv=p=0 "$f" 2>/dev/null | head -1 | tr -d '[:space:]')
      if [ "$SKIP_HDR" = "1" ]; then
        case "$ct" in smpte2084|arib-std-b67) continue ;; esac
      fi

      # Equal-quality heuristic: CRF still drives quality, but cap the output bitrate
      # at a share of the SOURCE bitrate (kbps = bytes/125/sec). HEVC at <= the
      # source's bitrate is >= its quality, and capping makes bloat impossible even
      # before we measure the result.
      dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" 2>/dev/null | cut -d. -f1)
      kbps=0; RATEOPT=""
      if [ "${dur:-0}" -gt 0 ]; then
        kbps=$(( sz / 125 / dur ))
        cap=$(( kbps * ${REENCODE_MAXRATE_PCT:-100} / 100 ))
        # Scoped to v:0 — the cover-art video streams below are copied, not encoded.
        [ "$cap" -gt 0 ] && RATEOPT="-maxrate:v:0 ${cap}k -bufsize:v:0 $(( cap * 2 ))k"
      fi

      # The output is Matroska, which refuses to write a header if ANY mapped stream
      # uses a codec it can't store — and that failure surfaces as a bogus filter
      # error ("Task finished with error code: -38 / Function not implemented"), so
      # it reads like a video problem when it's really the muxer. Three cases exist
      # in this library; work them out per file rather than guessing.
      #
      # NOTE: use `-of default=nw=1:nk=1`, NOT csv. csv appends a stray trailing
      # comma when a stream has an empty trailing field ("mjpeg,"), which silently
      # breaks the case matches below. And strip only ,/CR here — stripping all
      # whitespace would eat the newlines these loops split on.

      # 1. Data streams (bin_data/timecode): unstorable, and worthless in a library.
      DROPOPT="-map -0:d?"

      # 2. Cover art rides along as extra video streams. Matroska takes mjpeg/png
      #    as-is; anything else (one bmp here) has to go or the mux dies.
      i=0
      for c in $(ffprobe -v error -select_streams v -show_entries stream=codec_name -of default=nw=1:nk=1 "$f" 2>/dev/null | tr -d ',\r'); do
        if [ "$i" -gt 0 ]; then
          case "$c" in mjpeg|png) : ;; *) DROPOPT="$DROPOPT -map -0:v:$i" ;; esac
        fi
        i=$((i+1))
      done

      # 3. Subtitles: convert ONLY what Matroska cannot hold — mov_text (mp4 tx3g)
      #    and eia_608 CC. Everything else is copied, which matters enormously:
      #    most of this library's subtitles are image-based (hdmv_pgs/dvd_subtitle)
      #    and CANNOT become text, so a blanket -c:s srt would destroy them. Naming
      #    every stream explicitly also stops ffmpeg from quietly transcoding the
      #    unnamed ones to Matroska's default subtitle encoder (subrip -> ass).
      SUBOPT=""
      i=0
      for c in $(ffprobe -v error -select_streams s -show_entries stream=codec_name -of default=nw=1:nk=1 "$f" 2>/dev/null | tr -d ',\r'); do
        case "$c" in
          mov_text|eia_608) SUBOPT="$SUBOPT -c:s:$i srt" ;;
          *)                SUBOPT="$SUBOPT -c:s:$i copy" ;;
        esac
        i=$((i+1))
      done
      [ -z "$SUBOPT" ] && SUBOPT="-c:s copy"

      out="${f%.*}.reencode.tmp.mkv"
      echo ">> $f  ($vc ${h}p $((sz/1024/1024))MB ${kbps}kbps) -> $CODEC"
      # -threads caps decode (incl. software fallback) + encode; -filter_threads caps the
      # pix_fmt conversion. All ffmpeg work NUMA-pins to the GPU's socket (proc 2), so
      # uncapped threads turn one package into a hotspot while the other idles.
      #
      # Encode ONLY v:0. Library MKVs routinely carry poster/fanart/banner/thumb as
      # extra mjpeg "video" streams (a Scooby-Doo rip here has four, down to 120x176).
      # With a blanket -c:v the encoder is applied to those too, and NVENC rejects
      # anything under its minimum frame size ("Frame dimensions are less than the
      # minimum supported value") -> encoder init fails -> zero packets -> ffmpeg
      # aborts the WHOLE file. That silently failed every single file for weeks.
      # -c:v copy keeps the artwork bit-exact; -c:v:0 re-encodes the real video.
      # shellcheck disable=SC2086
      if ffmpeg -nostdin -y -threads "${THREADS:-6}" -filter_threads "${THREADS:-6}" $HWOPTS -i "$f" \
                -map 0 $DROPOPT -threads "${THREADS:-6}" -c:v copy -c:v:0 "$ENC" $QOPT $RATEOPT -pix_fmt:v:0 "$PIXFMT" \
                -c:a copy $SUBOPT "$out" </dev/null 2>/tmp/ff.log; then
        d2=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$out" 2>/dev/null | cut -d. -f1)
        newsz=$(stat -c %s "$out" 2>/dev/null || echo 0)
        if [ ! -s "$out" ] || [ "${d2:-0}" -lt "$(( ${dur:-0} - 2 ))" ]; then
          echo "   FAIL verify (dur ${dur:-?} vs ${d2:-?}) - keeping original"; rm -f "$out"
        elif [ "$newsz" -ge "$(( sz * ${KEEP_MAX_PCT:-90} / 100 ))" ]; then
          # No meaningful gain -> discard re-encode, keep original untouched, and
          # tombstone so future runs never re-attempt this file.
          echo "   no gain: $((sz/1024/1024))MB -> $((newsz/1024/1024))MB - keeping original, tombstoned"
          rm -f "$out"; echo "$rel" >> "$SKIPLIST"; count=$((count+1))
        else
          mkdir -p "$TRASH/$(dirname "$rel")"
          mv "$f" "$TRASH/$rel"
          touch "$TRASH/$rel"          # stamp trash time for the retention purge
          mv "$out" "${f%.*}.mkv"
          echo "   ok: $((sz/1024/1024))MB -> $((newsz/1024/1024))MB (saved $(( (sz-newsz)/1024/1024 ))MB, original parked in trash)"
          count=$((count+1))
        fi
      else
        # Surface the actual cause, not just the tail: ffmpeg reports the real error
        # (encoder init, bad param, unsupported pix_fmt) well ABOVE its final
        # "Conversion failed!" lines, so a plain tail hides it.
        echo "   ffmpeg error - keeping original:"
        grep -iE "error|failed|invalid|not supported|no capable" /tmp/ff.log | head -5
        tail -2 /tmp/ff.log
        rm -f "$out"
      fi
    done
    echo "reencoder: done"
