# Shared storage owned by this umbrella chart.
storage:
  create: true
  className: nfs-kubedata
  configClaim: mediaserver-config
  configSize: 50Gi
  dataClaim: mediaserver-data
  dataSize: 4Ti          # advisory only (nfs-subdir provisioner ignores it)

# Each app is its own subchart; flip enabled to deploy/remove it.
# App-level defaults (images, ports, ingress hosts) live in each subchart's
# values.yaml and already match the cluster - override here only as needed.
jellyfin:
  enabled: true
radarr:
  enabled: true
sonarr:
  enabled: true
prowlarr:
  enabled: true
transmission:
  enabled: true
  # vpn keys are NOT set here - create the transmission-vpn Secret out of band.

# Scheduled library re-encoder. Off by default - it rewrites media files in
# place (parking originals in a trash dir). Enable once you're ready, ideally
# after the GPU is in (set reencoder.gpu.enabled there too).
reencoder:
  enabled: true

# qBittorrent - replacement torrent client for transmission (better *arr
# integration; stalled/metadata states surface natively in the queue).
# OFF until cutover: it shares transmission's single WireGuard peer, and two
# gluetun tunnels on the same key fight over the session. To cut over:
#   1. create the qbittorrent-vpn Secret (same WIREGUARD_PRIVATE_KEY as
#      transmission-vpn)
#   2. flip transmission.enabled=false and qbittorrent.enabled=true (also in
#      the Argo app's valuesObject, which carries the non-secret vpn overrides)
#   3. re-point sonarr/radarr download client, re-add active torrents
qbittorrent:
  enabled: false
