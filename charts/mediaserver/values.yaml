# Shared storage owned by this umbrella chart.
storage:
  create: true
  className: nfs-kubedata
  configClaim: mediaserver-config
  configSize: 50Gi
  dataClaim: mediaserver-data
  dataSize: 4Ti          # advisory only (nfs-subdir provisioner ignores it)

# Each app is its own subchart; flip enabled to deploy/remove it.
# App-level defaults (images, ports, ingress hosts) live in each subchart's
# values.yaml and already match the cluster - override here only as needed.
jellyfin:
  enabled: true
  # Keep SQLite on the node's SSD mirror; media remains on the HDD/NFS claim.
  storage:
    configClaim: jellyfin-config-local
    createConfig: true
    configClass: local-path
    configSize: 20Gi
  image:
    # Preserve the installed version during storage cutover.
    tag: latest@sha256:b8dcc7b71d0ea872b74314da4b995c0cf282b1778438c295996e7be88c70fdda
radarr:
  enabled: true
sonarr:
  enabled: true
  declarativeSettings:
    enabled: true
  # SQLite WAL must use a local filesystem, not the shared NFS config claim.
  # Media already depends on this NFS server node; colocate the database there.
  nodeSelector:
    kubernetes.io/hostname: jayrdl3803
  image:
    # Keep the running version unchanged during the storage migration.
    tag: latest@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
  storage:
    configClaim: sonarr-config-local
    createConfig: true
    configClass: local-path
    configSize: 5Gi
prowlarr:
  enabled: true
# Cloudflare challenge solver for Prowlarr. Prowlarr reaches it in-cluster at
# http://flaresolverr.mediaserver.svc.cluster.local:8191 (add it as an Indexer
# Proxy tagged "flaresolverr", then tag the Cloudflare indexers). Config for
# that wiring lives in Prowlarr's DB on the config PVC, not in git.
flaresolverr:
  enabled: true
# Prometheus exporter for Prowlarr's indexer health. Feeds the ProwlarrIndexers*
# alerts in homelab-gitops (monitoring/rules/media-indexers.yaml), which page on
# the working-indexer COUNT dropping rather than on any single indexer failing.
exportarr-prowlarr:
  enabled: true
transmission:
  enabled: true
  # vpn keys are NOT set here - create the transmission-vpn Secret out of band.

# Scheduled library re-encoder. Off by default - it rewrites media files in
# place (parking originals in a trash dir). Enable once you're ready, ideally
# after the GPU is in (set reencoder.gpu.enabled there too).
reencoder:
  enabled: true

# qBittorrent - replacement torrent client for transmission (better *arr
# integration; stalled/metadata states surface natively in the queue).
# OFF until cutover: it shares transmission's single WireGuard peer, and two
# gluetun tunnels on the same key fight over the session. To cut over:
#   1. create the qbittorrent-vpn Secret (same WIREGUARD_PRIVATE_KEY as
#      transmission-vpn)
#   2. flip transmission.enabled=false and qbittorrent.enabled=true (also in
#      the Argo app's valuesObject, which carries the non-secret vpn overrides)
#   3. re-point sonarr/radarr download client, re-add active torrents
qbittorrent:
  enabled: false
