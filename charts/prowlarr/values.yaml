image:
  repository: docker.io/linuxserver/prowlarr
  tag: 2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
  pullPolicy: Always

port: 9696
puid: 1000
pgid: 1000
tz: America/Denver

# prowlarr is an indexer manager only - no media, so no data volume.
storage:
  configClaim: mediaserver-config
  dataClaim: mediaserver-data
  mountData: false

service:
  type: ClusterIP
  port: 9696

probe:
  path: /prowlarr/ping

initConfig:
  enabled: true

ingress:
  enabled: true
  className: traefik
  host: media.thereedfamily.rocks
  path: /prowlarr
  # Zitadel SSO (oauth2-proxy forwardAuth); /prowlarr/api bypasses it upstream where applicable
  ssoMiddlewares: false
  tls:
    enabled: true
    secretName: prowlarr-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

nodeSelector: {}
resources: {}
