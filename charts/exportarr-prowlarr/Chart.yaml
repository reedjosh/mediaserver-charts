apiVersion: v2
name: exportarr-prowlarr
description: >-
  Prometheus exporter for Prowlarr. Publishes indexer availability so alerting
  can page on "running low on working indexers" instead of Sonarr/Radarr pushing
  a notification for every individual indexer blip.
type: application
version: 0.1.0
appVersion: "v2.3.0"
dependencies:
  - name: common
    version: 0.1.0
    repository: file://../common
