{{/*
exportarr (prowlarr mode): turns Prowlarr's indexer health into Prometheus
metrics — prowlarr_indexer_enabled_total and prowlarr_indexer_unavailable
{indexer} — so "running low on working indexers" can be a VictoriaMetrics alert
with a long `for:`, instead of Sonarr/Radarr firing an ntfy push (and a matching
"restored" push) every time one public tracker has a bad twenty minutes.

Not a linuxserver.io image, so it does not use the common deployment template:
no PUID/PGID env, no /config or /data mount on the exporter itself.

The API key is generated by Prowlarr on first run and only exists in config.xml
on the shared RWX config PVC. The init container reads it there and drops it in
an emptyDir; exportarr picks it up via API_KEY_FILE. That keeps the key out of
git without needing an out-of-band Secret to stay in sync with Prowlarr.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "mediaserver.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mediaserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mediaserver.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: extract-api-key
          image: docker.io/busybox:1.36
          securityContext:
            # Reads config.xml off NFS, which is owned by the linuxserver uid.
            runAsUser: {{ .Values.puid }}
            runAsGroup: {{ .Values.pgid }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # On a cold cluster start Prowlarr may not have written config.xml
              # yet. Wait for it rather than crash-looping the exporter.
              i=0
              while [ ! -f /prowlarr-config/config.xml ]; do
                i=$((i + 1))
                if [ "$i" -gt 60 ]; then
                  echo "config.xml never appeared after 5m" >&2
                  exit 1
                fi
                echo "waiting for prowlarr config.xml ($i/60)"
                sleep 5
              done
              sed -n 's#.*<ApiKey>\(.*\)</ApiKey>.*#\1#p' /prowlarr-config/config.xml \
                | head -1 | tr -d '\n' > /apikey/key
              if [ ! -s /apikey/key ]; then
                echo "no <ApiKey> found in config.xml" >&2
                exit 1
              fi
              # exportarr runs as 65532, not this uid — keep the file readable.
              chmod 0644 /apikey/key
              echo "extracted prowlarr api key"
          volumeMounts:
            - name: prowlarr-config
              mountPath: /prowlarr-config
              subPath: {{ .Values.storage.prowlarrSubPath }}
              readOnly: true
            - name: apikey
              mountPath: /apikey
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["prowlarr"]
          env:
            - { name: URL,          value: {{ .Values.prowlarrUrl | quote }} }
            - { name: API_KEY_FILE, value: "/apikey/key" }
            - { name: PORT,         value: {{ .Values.port | quote }} }
            - { name: LOG_LEVEL,    value: {{ .Values.logLevel | quote }} }
            - { name: TZ,           value: {{ .Values.tz | quote }} }
          ports:
            - name: metrics
              containerPort: {{ .Values.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: apikey
              mountPath: /apikey
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: {{ .Values.storage.configClaim }}
        - name: apikey
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
