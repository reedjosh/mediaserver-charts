image:
  repository: docker.io/linuxserver/sonarr
  tag: latest
  pullPolicy: Always

port: 8989
puid: 1000
pgid: 1000
tz: America/Denver

# sonarr needs the data volume so it can hardlink imports from /data/torrents
# into /data/media/tv.
storage:
  configClaim: mediaserver-config
  dataClaim: mediaserver-data
  mountData: true

service:
  type: ClusterIP
  port: 8989

probe:
  path: /sonarr/ping

initConfig:
  enabled: true

ingress:
  enabled: true
  className: traefik
  host: media.thereedfamily.rocks
  path: /sonarr
  # Zitadel SSO (oauth2-proxy forwardAuth); /sonarr/api bypasses it upstream where applicable
  ssoMiddlewares: true
  tls:
    enabled: true
    secretName: sonarr-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

nodeSelector: {}
resources: {}
