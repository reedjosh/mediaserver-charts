image:
  repository: docker.io/linuxserver/jellyfin
  tag: latest
  pullPolicy: Always

port: 8096
puid: 1000
pgid: 1000
tz: America/Denver

# jellyfin only READS the library (it never hardlinks), so it doesn't need the
# single /data mount. Mounting the media as /movies + /tv subPaths matches the
# library paths jellyfin already has configured - no reconfig, no rescan.
storage:
  configClaim: mediaserver-config
  dataClaim: mediaserver-data
  mountData: false
  mediaMounts:
    - { path: /movies, subPath: media/movies }
    - { path: /tv,     subPath: media/tv }

service:
  type: ClusterIP
  port: 8096

probe:
  path: /health

# Served at the host root (own subdomain), so no UrlBase seeding needed.
initConfig:
  enabled: false

ingress:
  enabled: true
  className: traefik
  host: jelly.thereedfamily.rocks
  path: /
  # Native Jellyfin auth (TV/mobile clients can't do browser SSO); no ssoMiddlewares.
  # Traefik doesn't buffer responses and talks HTTP/1.1 to backends by default,
  # so the old nginx streaming annotations have no equivalent here.
  ssoMiddlewares: false
  tls:
    enabled: true
    secretName: jelly-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

# Co-locate jellyfin on the node that hosts the data volume (.227) so library
# reads are node-local instead of crossing the network via NFS from another node.
# The GPU resource below also pins it there (only .227 has one).
nodeSelector:
  kubernetes.io/hostname: jayrdl3803
# NVENC/NVDEC hardware transcoding: the device plugin injects the GPU; the
# "video" capability is required for the encoder/decoder engines.
extraEnv:
  NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"
resources:
  limits:
    nvidia.com/gpu: 1
